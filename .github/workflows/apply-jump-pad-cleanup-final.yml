name: Apply jump-pad cleanup final

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == '__apply_jump_pad_cleanup_final_20260721__'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Simplify introduction and checkpoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('content/docs/student-guide/index.mdx')
          text = path.read_text(encoding='utf-8')

          intro = '`BP_JumpPad` をステージに置き、Collision に触れたときの処理を追加して、プレイヤーが乗ると上へ飛ぶようにしましょう.\n\n'
          intro_alt = '`BP_JumpPad` をステージに置き、Collision に触れたときの処理を追加して、プレイヤーが乗ると上へ飛ぶようにしましょう。\n\n'
          if intro_alt in text:
              text = text.replace(intro_alt, '', 1)
          elif intro in text:
              text = text.replace(intro, '', 1)
          else:
              raise SystemExit('intro sentence not found')

          old = '''<Checkpoint>
- `BP_JumpPad` を自分でステージに置いている
- `Collision` の範囲を確認している
- `Collision` から `On Component Begin Overlap` を追加している
- ジャンプ台に触れた相手を `Cast To Character` で確認している
- `Launch Character` が Character を飛ばしている
- `Launch Velocity` の Z で上方向の強さを設定している
- プレイするとジャンプ台から上へ飛べる
</Checkpoint>'''

          new = '''<Checkpoint>
- `BP_JumpPad` を自分でステージに置いている
- `Collision` から `On Component Begin Overlap (Collision)` を追加している
- `Cast To Character` と `Launch Character` が正しくつながっている
- プレイするとジャンプ台から上へ飛べる
</Checkpoint>'''

          if text.count(old) != 1:
              raise SystemExit(f'expected one checkpoint block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/apply-jump-pad-cleanup-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/docs/student-guide/index.mdx .github/workflows/apply-jump-pad-cleanup-final.yml
          git commit -m "Simplify jump-pad checkpoint"
          git push origin HEAD:main
