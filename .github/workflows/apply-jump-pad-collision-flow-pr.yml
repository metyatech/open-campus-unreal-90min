name: Apply jump-pad collision flow from PR

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == '__apply_jump_pad_collision_flow_pr_20260721__'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite jump-pad lesson flow
        run: python .github/apply_jump_pad_collision_flow.py

      - name: Commit lesson and remove temporary files
        run: |
          rm .github/apply_jump_pad_collision_flow.py
          rm .github/workflows/apply-jump-pad-collision-flow.yml
          rm .github/workflows/apply-jump-pad-collision-flow-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/docs/student-guide/index.mdx .github
          git commit -m "Refine jump-pad collision workflow"
          git push origin HEAD:main
