name: Apply jump-pad callout numbering

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == '__apply_jump_pad_callout_numbering_20260721__'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply numbered callout copy
        run: python scripts/apply-jump-pad-callout-numbering.py

      - name: Verify exercise headings
        run: node scripts/verify-exercise-headings.mjs

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Checkout course-docs-site
        uses: actions/checkout@v6
        with:
          repository: metyatech/course-docs-site
          ref: main
          path: site

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Lint site against updated content
        working-directory: site
        env:
          COURSE_CONTENT_SOURCE: ..
        run: npm run lint

      - name: Build site with strict tutorial lint
        working-directory: site
        env:
          COURSE_CONTENT_SOURCE: ..
          TUTORIAL_LINT_STRICT: '1'
          TUTORIAL_LINT_COLLECT: '1'
        run: npm run build:verified

      - name: Commit numbered callouts and remove helpers
        run: |
          rm .github/workflows/apply-jump-pad-callout-numbering.yml
          rm scripts/apply-jump-pad-callout-numbering.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align jump-pad callout numbering"
          git push origin HEAD:main
