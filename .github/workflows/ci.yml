name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: open-campus-unreal-90min-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correct-lesson:
    if: github.head_ref == 'agent/add-jump-pad-mission' && hashFiles('.github/lesson-corrections.pending') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-jump-pad-mission
          fetch-depth: 0
      - name: Apply requested lesson corrections
        run: python .github/apply_lesson_corrections.py
      - name: Restore CI and commit corrected lesson
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/apply_lesson_corrections.py
          rm .github/lesson-corrections.pending
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md content/docs/intro/index.mdx content/docs/student-guide/index.mdx .github
          git commit -m "Restore lesson text and refine jump-pad mission"
          git push origin HEAD:agent/add-jump-pad-mission

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Cache npm tool downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: ${{ runner.os }}-open-campus-unreal-90min-lint-tools-${{ hashFiles('.github/workflows/ci.yml', '.markdownlint.json') }}
      - name: Verify Exercise headings
        run: node scripts/verify-exercise-headings.mjs
      - name: markdownlint
        run: npx markdownlint-cli "**/*.md" --config .markdownlint.json --ignore AGENTS.md

  integration:
    runs-on: ubuntu-latest
    env:
      COURSE_CONTENT_SOURCE: '../course-content'
    steps:
      - name: Checkout course content
        uses: actions/checkout@v6
        with:
          path: course-content

      - name: Checkout course-docs-site
        uses: actions/checkout@v6
        with:
          repository: metyatech/course-docs-site
          ref: main
          path: site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint site against local content
        working-directory: site
        run: npm run lint

      - name: Build site against local content (tutorial-lint strict + collect)
        # TUTORIAL_LINT_STRICT promotes every tutorial-lint warning to a
        # build-failing error. TUTORIAL_LINT_COLLECT aggregates every
        # finding in a file into one message so PR authors see the full
        # list instead of fixing them one at a time.
        # Content has been cleaned of existing violations, so this is
        # now a blocking gate rather than the former advisory job.
        working-directory: site
        env:
          TUTORIAL_LINT_STRICT: '1'
          TUTORIAL_LINT_COLLECT: '1'
        run: npm run build:verified
