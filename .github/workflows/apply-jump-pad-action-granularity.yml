name: Apply jump-pad action granularity

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == '__apply_jump_pad_action_granularity_20260721_094551__'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved action granularity changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('content/docs/student-guide/index.mdx')
          text = path.read_text(encoding='utf-8')
          start_marker = '<Section title="追加ミッション：ジャンプ台を作ろう（70〜85分）"'
          end_marker = '<Section title="任意：時間が余った場合（85〜90分）"'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('jump-pad mission boundaries were not found exactly once')

          replacement = '''<Section title="追加ミッション：ジャンプ台を作ろう（70〜85分）" goal="Collision にイベントを追加し、プレイヤーを上へ飛ばすジャンプ台を完成させます">

          ここまでで、最初にプレイした基本ゲームは完成です。ここからは、完成見本にはなかった新しい機能を追加します。

          <Section title="1. BP_JumpPad を置く" goal="ジャンプ台をステージに配置し、まだ動かないことを確認します">

          <Action>
            Content Drawer で `OpenCampus` フォルダを開きます。
          </Action>

          <Action img="./img/bp-jump-pad-drag-from-content-browser.png" alt="Content Drawer から BP_JumpPad をビューポートへドラッグ＆ドロップして配置するスクリーンショット">
            `BP_JumpPad` をビューポートへドラッグ＆ドロップします。
          </Action>

          <Action>
            移動ギズモを使って、キャラクターが上に乗れる場所へ移動します。
          </Action>

          <Action>
            「**▶ プレイ**」をクリックします。
          </Action>

          <Action>
            キャラクターを操作して、`BP_JumpPad` の上へ移動します。
          </Action>

          <Verify>ジャンプ台の上に乗っても、まだ上へ飛ばなければ確認完了です。</Verify>

          </Section>

          <Section title="2. Collision の範囲を確認する" goal="ジャンプ台が接触を検出する範囲を確認します">

          <Action>
            Content Drawer で `OpenCampus` フォルダを開きます。
          </Action>

          <Action>
            `BP_JumpPad` をダブルクリックします。
          </Action>

          <Concept title="Collision とは">
          `Collision` は、プレイヤーやほかの物体が触れたり、範囲内へ入ったりしたことを検出するための、見えない判定範囲です。
          </Concept>

          <Action>
            `Viewport` タブをクリックします。
          </Action>

          <Action img="./img/bp-jump-pad-collision-in-viewport.png" alt="BP_JumpPad の Viewport で Collision を選択し、ジャンプ台の判定範囲を確認するスクリーンショット">
            Components の `Collision` をクリックします。
          </Action>

          <Verify>ジャンプ台の上部に Collision の判定範囲が表示されていれば完了です。</Verify>

          </Section>

          <Section title="3. Collision に入ったときのイベントを追加する" goal="Collision に触れた瞬間から始まるイベントを追加します">

          <Action img="./img/bp-jump-pad-add-overlap-event.png" alt="BP_JumpPad の Components で Collision を右クリックし、Add Event から Add OnComponentBeginOverlap を選ぶスクリーンショット">
            Components の `Collision` を右クリックし、`Add Event`、`Add OnComponentBeginOverlap` の順にクリックします。
          </Action>

          <Concept title="On Component Begin Overlap">
          `On Component Begin Overlap` は、ほかの物体が Collision の範囲内へ入った瞬間に始まるイベントです。

          ノード名の末尾の `(Collision)` というのは、先ほど確認した `Collision` に対するイベントだということを表しています。
          </Concept>

          <Verify img="./img/bp-jump-pad-begin-overlap-added.png" alt="BP_JumpPad の Event Graph に On Component Begin Overlap (Collision) が追加されたスクリーンショット">Event Graph に `On Component Begin Overlap (Collision)` が追加されていれば完了です。</Verify>

          </Section>

          <Section title="4. 触れた相手が Character か確認する" goal="ジャンプ台に触れた相手を Character として扱える場合だけ処理を進めます">

          <Concept title="Other Actor">
          `On Component Begin Overlap (Collision)` の `Other Actor` には、Collision に触れた相手が入ります。プレイヤーが触れた場合は、プレイヤーキャラクターが入ります。
          </Concept>

          <Concept title="Cast To Character">
          `Cast To Character` は、触れた相手を Character として扱えるか確認するノードです。成功したときだけ Character 用の処理へ進めます。
          </Concept>

          <Action img="./img/bp-jump-pad-cast-character-connected.png" alt="BP_JumpPad の Event Graph で Other Actor から Cast To Character を追加し、Object と白い実行ピンが自動接続されたスクリーンショット">
            `Other Actor` のピンからドラッグし、検索欄に `Cast To Character` と入力して、`Cast To Character` を追加します。
          </Action>

          <Verify>`Other Actor` が `Object` につながり、白い実行線も `Cast To Character` へ自動でつながっていれば完了です。</Verify>

          </Section>

          <Section title="5. Launch Character を追加する" goal="Character に上方向の速度を与える処理を追加します">

          <Concept title="Launch Character">
          `Launch Character` は、Character に速度を与えて飛ばすノードです。今回は上方向の速度を与えて、ジャンプ台として使います。
          </Concept>

          <Action>
            `As Character` の青いピンからドラッグし、`Launch Character` を検索して追加します。
          </Action>

          <Verify>`As Character` が `Target` につながり、白い実行線も `Launch Character` へ自動でつながっていれば完了です。</Verify>

          </Section>

          <Section title="6. 上方向の速度を設定する" goal="プレイヤーが上へ飛ぶ強さを設定します">

          <Concept title="Launch Velocity">
          `Launch Velocity` は、Character をどの方向へ、どのくらいの強さで飛ばすかを表します。X と Y は水平方向、Z は上下方向です。
          </Concept>

          <Action>
            `Launch Character` の `Launch Velocity` の Z に `1200` を入力します。
          </Action>

          <Action>
            `Launch Character` の `Z Override` をオンにします。
          </Action>

          <Verify img="./img/bp-jump-pad-blueprint-complete.png" alt="BP_JumpPad の Event Graph で On Component Begin Overlap (Collision)、Cast To Character、Launch Character が接続され、Launch Velocity の Z が 1200 に設定された完成状態のスクリーンショット">`Launch Velocity` が X=`0`、Y=`0`、Z=`1200` で、`Z Override` がオン、`XY Override` がオフになっていれば完了です。</Verify>

          </Section>

          <Section title="7. コンパイルして試す" goal="ジャンプ台に乗るとプレイヤーが上へ飛ぶことを確認します">

          <Action>
            「**コンパイル**」をクリックします。
          </Action>

          <Verify>コンパイルアイコンが**緑のチェック**になれば成功です。</Verify>

          <Action>
            `BP_JumpPad` を保存します。
          </Action>

          <Action>
            メインエディターへ戻ります。
          </Action>

          <Action>
            「**▶ プレイ**」をクリックします。
          </Action>

          <Action>
            キャラクターを操作して、自分で置いたジャンプ台の上へ移動します。
          </Action>

          <Recovery title="ジャンプ台に乗っても飛ばないとき">
          次を順番に確認してください。

          - `On Component Begin Overlap (Collision)` が追加されている
          - `Other Actor` が `Cast To Character` の `Object` につながっている
          - `As Character` が `Launch Character` の `Target` につながっている
          - 白い実行線が途中で切れていない
          - `Launch Velocity` の Z が `1200` になっている
          - `Z Override` がオンになっている
          </Recovery>

          <Verify img="./img/bp-jump-pad-launch-in-play.png" alt="プレイ中にキャラクターが BP_JumpPad から上へ飛んでいるスクリーンショット">ジャンプ台に乗ったとき、プレイヤーが上へ飛べば追加ミッション成功です。</Verify>

          </Section>

          <Checkpoint>
          - `BP_JumpPad` を自分でステージに置いている
          - `Collision` から `On Component Begin Overlap (Collision)` を追加している
          - `Cast To Character` と `Launch Character` が正しくつながっている
          - プレイするとジャンプ台から上へ飛べる
          </Checkpoint>

          </Section>

          '''.replace('          ', '')

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify no manual auto-connection actions remain
        shell: python
        run: |
          from pathlib import Path
          text = Path('content/docs/student-guide/index.mdx').read_text(encoding='utf-8')
          forbidden = [
              '白い実行ピンを、`Cast To Character`',
              '白い実行ピンを、`Launch Character`',
              '`Target` へつなぎます',
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'forbidden manual auto-connection instruction remains: {value}')

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Checkout course-docs-site
        uses: actions/checkout@v6
        with:
          repository: metyatech/course-docs-site
          ref: main
          path: course-docs-site

      - name: Install site dependencies
        working-directory: course-docs-site
        run: npm ci

      - name: Verify exercise headings
        run: node scripts/verify-exercise-headings.mjs

      - name: Lint site against updated content
        working-directory: course-docs-site
        env:
          COURSE_CONTENT_SOURCE: ${{ github.workspace }}
        run: npm run lint

      - name: Build site with strict tutorial lint
        working-directory: course-docs-site
        env:
          COURSE_CONTENT_SOURCE: ${{ github.workspace }}
          TUTORIAL_LINT_STRICT: '1'
          TUTORIAL_LINT_COLLECT: '1'
        run: npm run build:verified

      - name: Commit approved changes and remove workflow
        run: |
          rm .github/workflows/apply-jump-pad-action-granularity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/docs/student-guide/index.mdx .github/workflows/apply-jump-pad-action-granularity.yml
          git commit -m "Split jump-pad actions by operation"
          git push origin HEAD:main
